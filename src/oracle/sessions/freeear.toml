# Free modulators that hear a lane or a group (step 93): a modulator that is in no lane and no group is given the notes that a lane's instrument is given (after its range, its pattern and its
# transpose) or those of a group's members, and not every note. The first lane takes the keys up to B3, plays a pattern that a held key starts, an octave up; the second takes the high keys.
# A free envelope hears the first lane and opens its filter (for the notes that the pattern plays: the chord, and not the high key); a control that follows the number of a note hears
# the second lane (C4 alone, which is not the chord) and drives its detune; a free LFO that starts again at every note hears the group and moves the damping of its reverb; a free
# envelope that hears every note drives the second lane's volume.
bpm = 100.0

[[group]]
[[group.effect]]
plugin = "builtin:reverb"
mix = 0.4

[[modulator]]
type = "envelope"
hears = "instrument[0]"
attack = 0.05
decay = 0.3
sustain = 0.4
release = 0.5
[[modulator.target]]
to = "instrument[0].effect[0]"
param = "cutoff"
depth = 0.6

[[modulator]]
type = "midi"
midi_key = true
hears = "instrument[1]"
[[modulator.target]]
to = "instrument[1]"
param = "detune"
depth = 0.2

[[modulator]]
type = "lfo"
retrigger = true
rate = 2.0
hears = "group[0]"
[[modulator.target]]
to = "group[0].effect[0]"
param = "damping"
depth = 0.4

[[modulator]]
type = "envelope"
attack = 0.02
decay = 0.2
sustain = 0.6
release = 0.3
[[modulator.target]]
to = "instrument[1]"
param = "volume"
depth = 0.5

[[instrument]]
plugin = "builtin:osc"
group = 0
range = "-B3"
transpose = 12
volume = 0.3
[instrument.params]
waveform = 3.0
[[instrument.effect]]
plugin = "builtin:filter"
[instrument.effect.params]
cutoff = 0.6
[instrument.pattern]
bpm = 100.0
length_beats = 1.0
base_note = "C3"
enabled = true
transpose = "chromatic"
[[instrument.pattern.events]]
frame = 0
status = "on"
note = "C3"
velocity = 100
[[instrument.pattern.events]]
frame = 9000
status = "off"
note = "C3"
velocity = 0
[[instrument.pattern.events]]
frame = 14400
status = "on"
note = "E3"
velocity = 90
[[instrument.pattern.events]]
frame = 24000
status = "off"
note = "E3"
velocity = 0

[[instrument]]
plugin = "builtin:osc"
range = "C4-"
volume = 0.3
