# Cables to the values that the host keeps (step 97): a lane's volume, an effect's mix, a group's volume and pan. A free LFO drives the first lane's volume, the mix of its filter and the group's
# pan; a free envelope (which hears every note) drives the mix of the reverb on the group's bus and, downwards, the group's volume; a free step sequencer drives the second lane's delay's mix
# and its volume.
bpm = 100.0

[[group]]
name = "Pad"
volume = 0.9
pan = 0.1
[[group.effect]]
plugin = "builtin:reverb"
mix = 0.5

[[modulator]]
type = "lfo"
waveform = "triangle"
rate = 1.5
[[modulator.target]]
to = "instrument[0]"
gain = "volume"
depth = 0.15
[[modulator.target]]
to = "instrument[0].effect[0]"
gain = "mix"
depth = 0.3
[[modulator.target]]
to = "group[0]"
gain = "pan"
depth = 0.5

[[modulator]]
type = "envelope"
attack = 0.2
decay = 0.4
sustain = 0.5
release = 0.6
[[modulator.target]]
to = "group[0].effect[0]"
gain = "mix"
depth = 0.4
[[modulator.target]]
to = "group[0]"
gain = "volume"
depth = -0.1

[[modulator]]
type = "steps"
steps = [0.5, -0.5, 0.25, 0.0]
length = 4
rate = 6.0
[[modulator.target]]
to = "instrument[1].effect[0]"
gain = "mix"
depth = 0.5
[[modulator.target]]
to = "instrument[1]"
gain = "volume"
depth = 0.1

[[instrument]]
plugin = "builtin:osc"
group = 0
volume = 0.3
[instrument.params]
waveform = 3.0
[[instrument.effect]]
plugin = "builtin:filter"
mix = 0.8

[[instrument]]
plugin = "builtin:osc"
volume = 0.3
transpose = 7
[[instrument.effect]]
plugin = "builtin:delay"
mix = 0.4
