# Example: a bass with a sub. A saw with a sine an octave under it (the oscillator's `sub`),
# through a low-pass filter that a short envelope opens at the start of each note, so that
# it plucks. The sound is an octave under the key that is pressed. Play low notes.
# On the page, try `sub` and the filter's cutoff.

[[instrument]]
plugin = "builtin:osc"
volume = 0.4

[instrument.params]
waveform = 3.0 # saw
sub = 1.0
attack = 0.004
release = 0.15

[[instrument.effect]]
plugin = "builtin:filter"
mix = 1.0

[instrument.effect.params]
cutoff = 0.55
resonance = 1.2

[[instrument.modulator]]
type = "envelope"
attack = 0.005
decay = 0.25
sustain = 0.4
release = 0.2

[[instrument.modulator.target]]
slot = 1
param = "cutoff"
depth = 0.6
