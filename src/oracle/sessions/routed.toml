# Lanes and groups whose way out is cut, heard through their cables. Group 0 ("Pad") goes nowhere by itself, and what its reverb makes is sent to the mix; lane 0, in it, goes nowhere
# and sends its dry sound to the bus of group 1 and what its filter makes to the reverb; lane 1, in no group, goes nowhere and sends half of itself to the mix; lane 2 is in
# group 1 as lanes are.
[[group]]
name = "Pad"
route = "none"

[[group.effect]]
plugin = "builtin:reverb"
mix = 1.0

[[group]]
name = "Echo"

[[group.effect]]
plugin = "builtin:delay"
mix = 0.4

[[instrument]]
plugin = "builtin:osc"
group = 0
route = "none"
volume = 0.25
[instrument.params]
waveform = 3.0
[[instrument.effect]]
plugin = "builtin:filter"

[[instrument]]
plugin = "builtin:osc"
route = "none"
volume = 0.25
transpose = 7
[instrument.params]
waveform = 2.0

[[instrument]]
plugin = "builtin:osc"
group = 1
volume = 0.2
transpose = -12

[[cable]]
from = "instrument[0]"
to = "group[1]"

[[cable]]
from = "instrument[0].effect[0]"
to = "group[0].effect[0]"
gain = 0.8

[[cable]]
from = "group[0].effect[0]"
to = "master"
gain = 0.8

[[cable]]
from = "group[0]"
to = "group[1]"
gain = 0.5

[[cable]]
from = "instrument[1]"
to = "master"
gain = 0.5
