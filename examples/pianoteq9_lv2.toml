[[instrument]]
plugin = "lv2:https://www.modartt.com/lv2/Pianoteq9"

[instrument.remap]
"F#2" = { note = "F2", detune = 1.0}
"G#2" = { note = "G2", detune = 1.0}
"A#2" = { note = "A2", detune = 1.0}
"C#6" = { note = "C6", detune = 1.0}
"D#6" = { note = "D6", detune = 1.0}
"F#6" = { note = "F6", detune = 1.0}
"G#6" = { note = "G6", detune = 1.0}
"A#6" = { note = "A6", detune = 1.0}

[[instrument.effect]]
plugin = "builtin:reverb"
mix = 0.25
preset = "Arcadia Dream Hall"

[instrument.effect.params]
damping = 0.29999983
decay = 0.901
diffusion = 0.59499997
level = 2.0
lowcut = 68.0
mod_depth = 0.5999999
mod_rate = 0.5375
predelay = 0.06249996
size = 0.8949999

[piano]
scale = "C major"
